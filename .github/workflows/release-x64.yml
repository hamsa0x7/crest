name: Build x64 Installer & Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (leave 'auto' to auto-increment from latest release)"
        type: string
        default: "auto"
      publish_release:
        description: "Publish as GitHub Release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Extract App Version
        id: meta
        shell: pwsh
        run: |
          git fetch --tags --force
          $inputVer = "${{ github.event.inputs.release_version }}"
          if ($inputVer -and $inputVer -ne "auto" -and $inputVer.Trim() -ne "") {
            $ver = $inputVer.Trim()
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref }}".Substring(11)
          } else {
            # Auto-increment patch version based on highest existing vX.* tag
            $matchingTags = git tag --list "vX.*" | ForEach-Object {
              if ($_ -match '^vX\.(\d+)\.(\d+)$') {
                [PSCustomObject]@{
                  Major = [int]$matches[1]
                  Minor = [int]$matches[2]
                }
              }
            } | Sort-Object -Property @{Expression="Major"; Descending=$true}, @{Expression="Minor"; Descending=$true}

            if ($matchingTags) {
              $latest = if ($matchingTags -is [array]) { $matchingTags[0] } else { $matchingTags }
              $nextMinor = $latest.Minor + 1
              $ver = "X.$($latest.Major).$nextMinor"
            } else {
              $ver = "X.1.3"
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Target release version: $ver, tag: v$ver"

      - name: Build Frontend
        run: npm run build

      - name: Build Standalone NSIS Installer
        shell: pwsh
        run: |
          npm run tauri -- build --target x86_64-pc-windows-msvc --no-sign

      - name: Format Installer Executable Name
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $original = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1
          if ($original) {
            $targetName = "Crest_${{ steps.meta.outputs.version }}_x64-setup.exe"
            $targetPath = Join-Path $nsisDir $targetName
            if ($original.FullName -ne $targetPath) {
              Move-Item -Path $original.FullName -Destination $targetPath -Force
              Write-Host "Renamed $($original.Name) -> $targetName"
            }
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crest-${{ steps.meta.outputs.version }}-x64-Setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Crest_${{ steps.meta.outputs.version }}_x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event.inputs.publish_release != false && github.event.inputs.publish_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Crest v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Crest_${{ steps.meta.outputs.version }}_x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
